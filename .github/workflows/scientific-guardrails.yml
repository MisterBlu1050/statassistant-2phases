name: Scientific guardrail regression tests

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/scientific-guardrails.yml"
      - "requirements.txt"
  push:
    branches:
      - "fix/scientific-guardrails-20261124"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pymupdf
      - name: Run all tests
        run: python -m pytest -q
